
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GlobalRecruit Hub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">GlobalRecruit Hub</a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <span class="tag">Welcome back</span>
      <h1>Sign in to your account</h1>
      <p>Continue your college recruitment journey.</p>

      <form id="login-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <p id="form-message" class="form-message"
           role="status" aria-live="polite"></p>

        <button class="button form-button" type="submit">
          Sign In
        </button>
      </form>

      <p class="auth-footer">
        New to GlobalRecruit Hub?
        <a href="/register.html">Create an account</a>
      </p>
    </section>
  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
